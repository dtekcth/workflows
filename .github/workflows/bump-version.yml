name: Bump version

on:
  workflow_call:
    inputs:
      update_type:
        description: "Set to patch/minor/major"
        required: true
        default: "patch"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get new version
        id: new_version
        run: |
          apt-get update
          apt-get install python3-semver
          ver="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          echo value="$(python -c "import semver;print(semver.Version.parse('$ver').bump_${{ inputs.update_type }}())")" >>"$GITHUB_OUTPUT"

      - name: Create release
        run: |
          git config user.name webredax
          git config user.email 309066399+webredax@users.noreply.github.com
          git add .
          git commit --allow-empty -m "Bump version to ${{ steps.new_version.outputs.value }}"
          git tag "v${{ steps.new_version.outputs.value }}"
          git push origin main
          git push origin "v${{ steps.new_version.outputs.value }}"
